services:
  bff:
    build: .
    container_name: ms_bff
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
      - ENTRA_ISSUER_URI=${ENTRA_ISSUER_URI}
      - ENTRA_API_CLIENT_ID=${ENTRA_API_CLIENT_ID}
      - URL_CLIENTES=${URL_CLIENTES}
      - URL_CATALOGO=${URL_CATALOGO}
      - URL_PEDIDOS=${URL_PEDIDOS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    restart: unless-stopped

