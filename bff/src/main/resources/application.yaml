server:
  port: 8080

spring:
  application:
    name: bff
  # Para correr local con mvnw leyendo el .env (en Docker no hace falta, pero no molesta)
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}
          audiences:
            - ${ENTRA_API_CLIENT_ID}

microservices:
  clientes:
    base-url: ${URL_CLIENTES:http://localhost:8081}
  catalogo:
    base-url: ${URL_CATALOGO:http://localhost:8082}
  pedidos:
    base-url: ${URL_PEDIDOS:http://localhost:8084}
  kafka-admin:
    base-url: ${URL_KAFKA_ADMIN:http://localhost:8087}
  reportes:
    base-url: ${URL_REPORTES:http://localhost:8088}
  auditoria:
    base-url: ${URL_AUDITORIA:http://localhost:8089}
  rabbit-admin:
    base-url: ${URL_RABBIT_ADMIN:http://localhost:8091}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger: interfaz en /swagger-ui.html y especificación en /v3/api-docs.
# Es solo documentación (los endpoints siguen protegidos). Para apagarlo: SWAGGER_ENABLED=false
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
