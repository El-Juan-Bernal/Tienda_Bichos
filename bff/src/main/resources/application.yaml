server:
  port: 8080

spring:
  application:
    name: bff
  # Para correr local con mvnw leyendo el .env (en Docker no hace falta, pero no molesta)
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}
          audiences:
            - ${ENTRA_API_CLIENT_ID}

microservices:
  clientes:
    base-url: ${URL_CLIENTES:http://localhost:8081}
  catalogo:
    base-url: ${URL_CATALOGO:http://localhost:8082}
  pedidos:
    base-url: ${URL_PEDIDOS:http://localhost:8084}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

