version: '3.8'
services:
  db-insectos:
    image: mysql:8.0
    container_name: mysql-tienda-bichos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tienda_bichos_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-tienda-bichos
    environment:
      PMA_HOST: db-insectos
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8083:80"
    depends_on:
      - db-insectos

  rabbitmq-principal:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-principal
    ports:
      - "5672:5672"
      - "15672:15672"

  rabbitmq-proveedores:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-proveedores
    ports:
      - "5673:5672"
      - "15673:15672"

volumes:
  db_data:

