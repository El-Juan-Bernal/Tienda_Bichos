services:
  auditoria:
    build: .
    container_name: ms_auditoria
    ports:
      - "8089:8089"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    restart: unless-stopped
