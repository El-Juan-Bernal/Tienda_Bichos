server:
  port: 8086

spring:
  application:
    name: ms-proveedores

  # Carga las variables del archivo .env (MAIL_USERNAME, MAIL_PASSWORD)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tienda_bichos_db?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Conexión al RabbitMQ Secundario
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    listener:
      simple:
        # Si falla, el mensaje va directo a la DLQ sin reintentos infinitos
        default-requeue-rejected: false

  # Servidor de correos con variables del .env
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Correos B2B por categoría
proveedores:
  terrestres: jaba.duoc@gmail.com
  voladores: jaba.duoc@gmail.com
  acuaticos: jaba.duoc@gmail.com

