server:
  port: 8085

spring:
  application:
    name: ms-notificaciones

  # Carga las variables del .env (GMAIL_USER, GMAIL_APP_PASS, SLACK_WEBHOOK_URL)
  config:
    import: optional:file:.env[.properties]

  # RabbitMQ principal
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER}
    password: ${GMAIL_APP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

