spring:
  application:
    name: ms-kafka-admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

server:
  port: ${SERVER_PORT:8087}

kafka-admin:
  crear-topicos-al-iniciar: ${CREAR_TOPICOS:true}
  # Tópicos que se crean al iniciar si faltan. La retención se escribe en DÍAS.
  topicos-base:
    - nombre: orders.events
      particiones: 3
      replicas: 3
      politica: delete
      retencion-dias: 7
    - nombre: audit.timeline
      particiones: 3
      replicas: 3
      politica: compact,delete
      retencion-dias: 30
    - nombre: orders.events.audit.DLT
      particiones: 3
      replicas: 3
      politica: delete
      retencion-dias: 14
    - nombre: orders.events.report.DLT
      particiones: 3
      replicas: 3
      politica: delete
      retencion-dias: 14

# Swagger: interfaz en /swagger-ui.html y especificación en /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

