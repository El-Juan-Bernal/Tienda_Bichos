server:
  port: 8084

spring:
  application:
    name: ms-pedidos
  datasource:
    url: jdbc:mysql://localhost:3306/tienda_bichos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
microservices:
  catalogo:
    base-url: ${URL_CATALOGO:http://localhost:8082}

