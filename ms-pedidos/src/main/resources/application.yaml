server:
  port: 8084

spring:
  application:
    name: ms-pedidos

  # Lee el .env cuando corres con mvnw en tu PC (en Docker/AWS no hace falta)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tienda_bichos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # RabbitMQ principal (pedidos, correos, bodega)
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

microservices:
  catalogo:
    base-url: ${URL_CATALOGO:http://localhost:8082}

