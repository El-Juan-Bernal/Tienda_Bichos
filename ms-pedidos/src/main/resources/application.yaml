server:
  port: 8084

spring:
  application:
    name: ms-pedidos

  # Lee el .env cuando corres con mvnw en tu PC (en Docker/AWS no hace falta)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tienda_bichos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # RabbitMQ principal (pedidos, correos, bodega, stock)
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

  # Kafka: eventos de negocio (analítica y auditoría)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 3000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000

microservices:
  catalogo:
    base-url: ${URL_CATALOGO:http://localhost:8082}

# Tiempos del avance automático de estados (segundos)
pedidos:
  avance:
    espera-preparacion-segundos: ${AVANCE_PREPARACION_SEG:60}
    espera-despacho-segundos: ${AVANCE_DESPACHO_SEG:60}
    espera-entrega-segundos: ${AVANCE_ENTREGA_SEG:10}

kafka:
  topic:
    orders-events: ${KAFKA_TOPIC_ORDERS:orders.events}

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ERROR


