services:
  rabbit-admin:
    build: .
    container_name: ms_rabbit_admin
    ports:
      - "8091:8091"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
      - RABBIT_PRINCIPAL_URL=${RABBIT_PRINCIPAL_URL}
      - RABBIT_PROVEEDORES_URL=${RABBIT_PROVEEDORES_URL}
      - RABBIT_USER=${RABBIT_USER}
      - RABBIT_PASS=${RABBIT_PASS}
    restart: unless-stopped
